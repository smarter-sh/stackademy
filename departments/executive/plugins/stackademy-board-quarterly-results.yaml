apiVersion: smarter.sh/v1
kind: SqlPlugin
metadata:
  name: stackademy_board_quarterly_results
  description: "Revenue, expenses and net income by quarter of 2025, totalled by the database, from the Board Pack's totals."
  pluginClass: sql
  version: 1.0.0
  tags:
  - stackademy
  - executive
  - sql
spec:
  selector:
    directive: always
  prompt:
    provider: openai
    model: gpt-6-luna
    temperature: 0.2
    maxTokens: 2048
    systemRole: |
      You query the Board Pack of Stackademy's executives, for their assistant. Use the tool's results as they are.
  connection: stackademy_executive_db
  sqlData:
    limit: 25
    sqlQuery: |
      SELECT fiscal_quarter,
        SUM(CASE WHEN account_type = 'revenue' THEN amount ELSE 0 END) AS revenue,
        SUM(CASE WHEN account_type = 'expense' THEN amount ELSE 0 END) AS expenses,
        SUM(CASE WHEN account_type = 'revenue' THEN amount ELSE -amount END) AS net_income
      FROM board_income_statement
      WHERE (fiscal_quarter = {quarter} OR {quarter} IS NULL)
      GROUP BY fiscal_quarter
      ORDER BY fiscal_quarter;
    parameters:
    - name: quarter
      type: integer
      description: the quarter of 2025, from 1 to 4. Omit it for every quarter.
      required: false
      enum: null
    testValues:
    - name: quarter
      value: 3
