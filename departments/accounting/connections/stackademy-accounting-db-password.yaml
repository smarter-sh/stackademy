apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: >-
    The password of stackademy_accounting, the read-only database user of Stackademy Accounting, which may read the directory, Accounting's tables, and Admissions' sales and payments. It is a
    public password of a demonstration database: never use it for anything else.
  name: stackademy_accounting_db_password
  version: 1.0.0
  tags:
    - stackademy
    - accounting
spec:
  config:
    value: stackademy_accounting
