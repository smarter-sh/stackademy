apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: >-
    The password of stackademy_admissions, the read-only database user of Stackademy Admissions, which may read the catalogue's courses and cohorts, and Admissions' tables. It is a
    public password of a demonstration database: never use it for anything else.
  name: stackademy_admissions_db_password
  version: 1.0.0
  tags:
    - stackademy
    - admissions
spec:
  config:
    value: stackademy_admissions
