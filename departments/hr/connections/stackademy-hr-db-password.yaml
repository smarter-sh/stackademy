apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: >-
    The password of stackademy_hr, the read-only database user of Stackademy HR, which may read the directory, and HR's tables: compensation, time off and hiring. It is a
    public password of a demonstration database: never use it for anything else.
  name: stackademy_hr_db_password
  version: 1.0.0
  tags:
    - stackademy
    - hr
spec:
  config:
    value: stackademy_hr
