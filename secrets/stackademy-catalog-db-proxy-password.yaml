apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: |
    A password for reaching Stackademy's course database, stackademy, through a proxy server. It is a public
    password of a demonstration database, which anyone may read: never use it for anything else.
    See the annotations below for the connection details.
  name: stackademy_catalog_db_proxy_password
  version: 2.0.0
  tags:
    - example
    - stackademy
  annotations:
    smarter.sh/stackademy/host: smarter-mariadb
    smarter.sh/stackademy/port: "3306"
    smarter.sh/stackademy/db: stackademy
    smarter.sh/stackademy/user: stackademy_catalog_proxy
    smarter.sh/stackademy/access: anyone may read the course catalogue
spec:
  config:
    value: stackademy_catalog_db_proxy_password
