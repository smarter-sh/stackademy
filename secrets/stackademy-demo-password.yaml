apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: >-
    The password of every fictional demonstration user of Stackademy, e.g. its HR Director, whose User manifests in
    org/users name this Secret in passwordSecret. It is published, so that anyone may sign in as one of them and try
    what an account's administrator, or member, may do: never use it for anything else.
  name: stackademy_demo_password
  version: 1.0.0
  tags:
    - stackademy
    - demo
spec:
  config:
    value: stackademy-demo
