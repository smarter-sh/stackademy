apiVersion: smarter.sh/v1
kind: Secret
metadata:
  description: |
    The api key of Stackademy's course catalogue api, /api/v1/demos/stackademy/course-catalogue/, on every Smarter
    platform. It is a public key of a demonstration api, which anyone may read: never use it for anything else.
  name: stackademy_catalog_api_key
  version: 2.0.0
  tags:
    - example
    - stackademy
    - api
  annotations:
    smarter.sh/stackademy/path: /api/v1/demos/stackademy/course-catalogue/
    smarter.sh/stackademy/access: anyone may read the course catalogue
spec:
  config:
    # the value of the Secret's former name, smarter_test_api: older releases of Smarter accept only the value of
    # that Secret, which they find by its name. It changes once every platform runs a release that finds this one.
    value: smarter_test_api
