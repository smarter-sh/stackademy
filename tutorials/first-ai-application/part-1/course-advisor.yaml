apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  name: course_advisor
  description: Answers students' questions about Stackademy's courses.
  version: 1.0.0
spec:
  config:
    prompt:
      provider: openai
      defaultModel: gpt-6-luna
      defaultSystemRole: >
        You are Stanley, a friendly student advisor at Stackademy, an online
        code academy. Answer questions about Stackademy's courses in a few
        short sentences.
      appName: Stackademy Course Advisor
      appAssistant: Stanley
      appWelcomeMessage: Hi, I'm Stanley. What would you like to learn?
      appExamplePrompts:
        - Do you offer any courses on AI?
        - My budget is $1,000. What courses can I take?
