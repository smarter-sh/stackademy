apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: stackademy_topics
  description: Keeps Stanley to Stackademy's courses, by asking a small LLM whether a student's message is within his scope.
  version: 1.1.0
spec:
  config:
    isActive: true
    mode: enforce
    stage: input
    category: off_topic
    strategy: llm_judge
    judgePrompt: |-
      You are a scope classifier for Stanley, the student advisor of Stackademy, an
      online code academy. Stanley may help only with Stackademy's courses, their
      subjects, prices and prerequisites, choosing what to study, and Stackademy's
      student policies, such as enrollment, refunds, extensions, grading,
      certificates, accessibility and academic honesty.

      Decide whether the user message below is OUTSIDE that scope.

      User message:
      """
      {text}
      """

      Respond with a JSON object only: {{"triggered": true if out of scope, "confidence": 0.0 to 1.0, "rationale": "one sentence"}}
    model: gpt-6-luna
    threshold: 0.8
    action: block
    message: I can only help with Stackademy's courses. Ask me what to study, what a course costs, or what to take first.
    severity: 2
    priority: 80
