# Runs make test on every pull request and on every change to main: the unit tests in tests/, which validate
# each manifest on a Smarter platform with the Smarter Python SDK and test the back office's generator, then the
# checks in .pre-commit-config.yaml. The result shows on the pull request, and the coverage of scripts/ goes to
# Codecov, for the README's badge.
#
# Needs, in the repository's settings (Secrets and variables, Actions):
#   - the secret SMARTER_API_KEY: an api key of the platform that validates the manifests;
#   - the variable SMARTER_BASE_URL: that platform's url, e.g. https://platform.example.com;
#   - the secret CODECOV_TOKEN: the repository's upload token on codecov.io, for the coverage of scripts/.
# Pull requests from forks don't receive the secret, so their tests stop with an error that says so.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the tests
        env:
          SMARTER_API_KEY: ${{ secrets.SMARTER_API_KEY }}
          SMARTER_BASE_URL: ${{ secrets.SMARTER_BASE_URL }}
        run: |
          make init
          make test

      - name: Write the coverage report
        run: venv/bin/python -m coverage xml

      - name: Upload the coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
