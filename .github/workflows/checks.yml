# Runs the checks in .pre-commit-config.yaml on every pull request, and on every change to main,
# so that they run even for changes made in GitHub's web editor. The result shows on the pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check the manifests
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository's files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the checks
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure
