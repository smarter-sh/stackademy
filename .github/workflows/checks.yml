# Runs the checks in .pre-commit-config.yaml, and loads the course database, on every pull request
# and on every change to main, so that they run even for changes made in GitHub's web editor. The
# result shows on the pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the checks
        run: |
          python -m pip install --quiet -r requirements.txt
          pre-commit run --all-files --show-diff-on-failure

  database:
    name: Load the course database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repository's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MariaDB
        run: |
          docker run --detach --name smarter-mariadb --env MARIADB_ROOT_PASSWORD=smarter mariadb:11
          until docker exec smarter-mariadb mariadb -u root -psmarter -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done

      # The same way that Smarter's local development environment does: into the smarter-mariadb container.
      - name: Load the course database, twice
        run: |
          ./scripts/create-course-database.sh
          ./scripts/create-course-database.sh

      # create-course-database.sh has checked the data, and each department's user: that it may read its
      # tables, and nothing else. This checks that the generated back office is what its generator makes.
      - name: Check that the back office is up to date with its generator
        run: python3 -I scripts/generate_backoffice.py --check
