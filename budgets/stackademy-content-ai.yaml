apiVersion: smarter.sh/v1
kind: Budget
metadata:
  name: stackademy_content_ai
  version: 1.0.0
  tags:
  - stackademy
  - content
  - department
  description: 'Stackademy Course Content''s monthly AI budget: what its assistant and its plugins may spend each month.'
spec:
  config:
    unit: cost
    period: month
    periodicLimit: 150.0
    absoluteLimit: 1800.0
    duration: 0
    action: block
    warningThreshold: 80
    message: Stackademy Course Content has used this month's AI budget. Ask Stackademy's CFO to raise it.
  resources:
  - kind: LLMClient
    name: stackademy_content_assistant
    accountNumber: 2718-2818-0004
  - kind: SqlPlugin
    name: stackademy_content_course_status
    accountNumber: 2718-2818-0004
  - kind: SqlPlugin
    name: stackademy_content_production_tasks
    accountNumber: 2718-2818-0004
