apiVersion: smarter.sh/v1
kind: Budget
metadata:
  name: stackademy_hr_ai
  version: 1.0.0
  tags:
  - stackademy
  - hr
  - department
  description: 'Stackademy HR''s monthly AI budget: what its assistant and its plugins may spend each month.'
spec:
  config:
    unit: cost
    period: month
    periodicLimit: 150.0
    absoluteLimit: 1800.0
    duration: 0
    action: block
    warningThreshold: 80
    message: Stackademy HR has used this month's AI budget. Ask Stackademy's CFO to raise it.
  resources:
  - kind: LLMClient
    name: stackademy_hr_assistant
    accountNumber: 2718-2818-0002
  - kind: SqlPlugin
    name: stackademy_hr_headcount
    accountNumber: 2718-2818-0002
  - kind: SqlPlugin
    name: stackademy_hr_employee
    accountNumber: 2718-2818-0002
  - kind: SqlPlugin
    name: stackademy_hr_requisitions
    accountNumber: 2718-2818-0002
